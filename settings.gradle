pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            // Официальный репозиторий Linphone (обязательно со слэшем на конце!)
            url = uri("https://download.linphone.org/maven_repository/")
            content {
                includeGroup("org.linphone")
                includeGroup("org.linphone.bundled")
                includeGroup("org.linphone.no-video")
            }
        }
    }
}

rootProject.name = "Profi CRM"
include ':app'
