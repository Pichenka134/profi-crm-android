name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Явно указываем пакеты, чтобы не запрашивался удалённый "tools"
          packages: 'platform-tools'
          ndk-version: 25.2.9519653

      - name: Download Linphone AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/linphone-sdk-android-5.4.0.aar \
            https://download.linphone.org/maven_repository/org/linphone/bundled/linphone-sdk-android/5.4.0/linphone-sdk-android-5.4.0.aar
          ls -lh app/libs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfiCRM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
